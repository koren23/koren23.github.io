const DATA=[];
ERAS.forEach(e=>(RAW[e.id]||"").split("\n").forEach(l=>{
  if(!l.trim())return;
  const [t,type,y,src]=l.split("|");
  DATA.push({t,type,y,src:src||"",era:e.id,k:e.id+"|"+t});
}));

/* owned state (saved in this browser) */
let owned={};try{owned=JSON.parse(localStorage.getItem("avatarOwned")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("avatarOwned",JSON.stringify(owned))}catch(e){}};

const $=s=>document.querySelector(s),out=$("#out"),stat=$("#stat");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=s=>s.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
/* covers: episodes use covers/<show>-s<N>.jpg (atla-s1, korra-s2, seven-havens-s1); anthology comics use covers/<anthology-slug>.jpg; otherwise covers/<title-slug>.jpg */
function covers(d){
  const a=[];
  const m=/^(ATLA|Korra|Seven Havens|Legend of Korra) S(\d+)E/.exec(d.src);
  if(m)a.push("covers/"+slug(m[1].replace("Legend of ",""))+"-s"+m[2]+".jpg");
  else if(d.type==="cs"&&d.src)a.push("covers/"+slug(d.src)+".jpg");
  if(d.type==="gn")a.push("covers/"+slug(d.t.replace(/,? Part (One|Two|Three)$/,""))+".jpg");   /* graphic-novel parts share one cover */
  a.push("covers/"+slug(d.t)+".jpg");
  return a;
}
const types=new Set(),cnt={};DATA.forEach(d=>cnt[d.type]=(cnt[d.type]||0)+1);
const chips=$("#chips");
chips.innerHTML=Object.keys(TYPES).filter(k=>cnt[k]).map(k=>`<button class="chip" data-k="${k}" style="--c:${TYPES[k][1]}" aria-pressed="false">${TYPES[k][0]}<small>${cnt[k]}</small></button>`).join("")+'<button class="chip clr" id="clr" hidden>Clear</button>';
chips.onclick=e=>{
  const b=e.target.closest(".chip");if(!b)return;
  if(b.id==="clr")types.clear();else{const k=b.dataset.k;types.has(k)?types.delete(k):types.add(k)}
  chips.querySelectorAll("[data-k]").forEach(c=>c.setAttribute("aria-pressed",types.has(c.dataset.k)));
  $("#clr").hidden=!types.size;apply();
};

out.innerHTML=DATA.map((d,i)=>
  `<div class="r" data-i="${i}" style="--c:hsl(${TYPES[d.type][1]} 55% 38%)"><img class="cv" alt="" data-s="${covers(d).join(",")}"><div class="tx"><div class="t">${esc(d.t)}</div><div class="m">${TYPES[d.type][0]} · ${esc(d.y)}${d.src?" · "+esc(d.src):""}</div></div><div class="ck">✓</div></div>`).join("");

/* lazy cover loading with fallback chain, then a letter placeholder */
function loadCover(img){
  const list=(img.dataset.s||"").split(",").filter(Boolean);
  const next=()=>{
    const s=list.shift();
    if(!s){const d=DATA[img.closest(".r").dataset.i];img.replaceWith(Object.assign(document.createElement("div"),{className:"cv",textContent:d.t[0]}));return}
    img.src=s;
  };
  img.onerror=next;next();
}
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){io.unobserve(en.target);loadCover(en.target)}}),{rootMargin:"300px"});
out.querySelectorAll("img.cv").forEach(i=>io.observe(i));

const rowEls=[...out.querySelectorAll(".r")];
rowEls.forEach(r=>{if(owned[DATA[r.dataset.i].k])r.classList.add("own")});
out.onclick=e=>{
  const r=e.target.closest(".r");if(!r)return;
  const k=DATA[r.dataset.i].k;
  if(owned[k]){delete owned[k]}else owned[k]=1;
  r.classList.toggle("own",!!owned[k]);save();apply();
};

let mode="all";
$("#ow").onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.v;$("#ow").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));apply()};
$("#q").oninput=apply;

function apply(){
  const q=$("#q").value.trim().toLowerCase();
  let vis=0,own=0;
  rowEls.forEach(r=>{
    const d=DATA[r.dataset.i],o=!!owned[d.k];
    if(o)own++;
    const ok=(!types.size||types.has(d.type))&&(mode==="all"||(mode==="own")===o)&&(!q||(d.t+" "+d.src+" "+d.y).toLowerCase().includes(q));
    r.hidden=!ok;if(ok)vis++;
  });
  $("#none").hidden=vis>0;
  stat.textContent=own+" / "+DATA.length+" owned";
}
apply();
</script>
