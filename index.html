<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koren23</title>
<style>
:root{color-scheme:dark}
html,body{height:100%;margin:0;background:#000;color:#e8e8e8;font-family:Georgia,serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;touch-action:pan-y;user-select:none;-webkit-user-select:none;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#ring{position:relative;width:100%;height:300px}
.card{position:absolute;left:50%;top:50%;width:170px;height:240px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:14px;box-sizing:border-box;cursor:pointer;background:linear-gradient(160deg,hsl(var(--h) 70% 30%),hsl(var(--h) 60% 8%));border:1px solid rgba(255,255,255,.12);will-change:transform}
.card.front{box-shadow:0 0 44px hsl(var(--h) 80% 40% / .55)}
.ic{font-size:52px}
.tt{font-size:17px;line-height:1.25;font-weight:bold}
#name{margin:0;font-size:clamp(20px,5vw,30px);letter-spacing:.1em;text-transform:uppercase;color:#c8102e;text-align:center;padding:0 16px}
#hint{margin:0;color:#777;font-size:13px}
.nav{display:flex;gap:16px}
.nav button{background:#111;color:#ddd;border:1px solid #333;border-radius:50%;width:46px;height:46px;font-size:24px;cursor:pointer}
</style>
</head>
<body>
<div id="ring"></div>
<h1 id="name"></h1>
<p id="hint"></p>
<div class="nav"><button id="prev" aria-label="Previous">‹</button><button id="next" aria-label="Next">›</button></div>
<script>
/* ADD YOUR SITES HERE. One line per site.
   path = folder (e.g. "my-site/") or file (e.g. "game.html") inside this repo. */
const SITES=[
  {title:"Stephen King Catalogue",path:"stephen-king/index.html",icon:"📖",hue:350},
  {title:"Home Page",path:"koren23.githu.IO",icon:"🏠",hue:210},
  {title:"Wishlist",path:"https://wshl.st/koren",icon:"🎁",hue:130},
   
  // {title:"My Next Site",path:"my-next-site/",icon:"🎬",hue:210},
  // {title:"Another Page",path:"another.html",icon:"🎮",hue:130},
];

const N=SITES.length,step=360/N,ring=document.getElementById("ring"),name=document.getElementById("name");
document.getElementById("hint").textContent=N>1?"Swipe to spin · tap the front card to open":"Tap the card to open";
let rot=0,target=0,front=0,drag=null,justDragged=false;
const cards=SITES.map((s,i)=>{
  const d=document.createElement("div");d.className="card";
  d.style.setProperty("--h",s.hue!==undefined?s.hue:(i*67)%360);
  d.innerHTML='<div class="ic"></div><div class="tt"></div>';
  d.firstChild.textContent=s.icon||"🌐";d.lastChild.textContent=s.title;
  d.onclick=()=>{if(justDragged)return;if(i===front)location.href=s.path;else goTo(i)};
  ring.appendChild(d);return d;
});
function draw(){
  const r=Math.min(innerWidth*0.38,200);
  cards.forEach((c,i)=>{
    const th=(i*step+rot)*Math.PI/180,x=Math.sin(th)*r,z=Math.cos(th),k=(z+1)/2;
    c.style.transform=`translate(-50%,-50%) translate(${x}px,${(1-z)*-18}px) scale(${.6+.4*k})`;
    c.style.opacity=N===1?1:.25+.75*k;
    c.style.zIndex=Math.round(k*100);
    c.classList.toggle("front",k>.98);
  });
  front=((Math.round(-rot/step)%N)+N)%N;
  name.textContent=SITES[front].title;
}
function shift(dir){target=-(Math.round(-target/step)+dir)*step}
function goTo(i){let d=i-front;if(d>N/2)d-=N;if(d<-N/2)d+=N;shift(d)}
function loop(){const d=target-rot;if(Math.abs(d)>.01){rot+=d*.14;draw()}requestAnimationFrame(loop)}
addEventListener("pointerdown",e=>{drag={x:e.clientX,r:rot,m:0}});
addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.m=Math.max(drag.m,Math.abs(dx));if(drag.m>6){rot=target=drag.r+dx*.35;draw()}});
addEventListener("pointerup",()=>{if(!drag)return;if(drag.m>6){justDragged=true;setTimeout(()=>justDragged=false,60);target=Math.round(rot/step)*step}drag=null});
let lastWheel=0;
addEventListener("wheel",e=>{const t=Date.now();if(t-lastWheel<250)return;lastWheel=t;shift((e.deltaY>0||e.deltaX>0)?1:-1)});
addEventListener("keydown",e=>{if(e.key==="ArrowRight")shift(1);else if(e.key==="ArrowLeft")shift(-1);else if(e.key==="Enter")location.href=SITES[front].path});
document.getElementById("next").onclick=()=>shift(1);
document.getElementById("prev").onclick=()=>shift(-1);
addEventListener("resize",draw);
draw();loop();
</script>
</body>
</html>
